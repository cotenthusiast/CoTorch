name: CoTorch-CI
run-name: ${{ github.actor }}'s CoTorch CI

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S cpp -B cpp/build
      - run: cmake --build cpp/build
      - run: ctest --test-dir cpp/build --output-on-failure
